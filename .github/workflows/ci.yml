name: CI

on:
  pull_request:
  push:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run format:check
      - run: npm test
      - run: npm run test:unit:tz

  db-and-e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Start local Supabase
        run: |
          set -o pipefail
          npx supabase start \
            -x realtime,storage-api,imgproxy,studio,edge-runtime,logflare,vector,postgres-meta,supavisor \
            2>&1 | sed -E \
              -e 's/("(ANON_KEY|PUBLISHABLE_KEY|SERVICE_ROLE_KEY|SECRET_KEY|JWT_SECRET|DB_URL)"[[:space:]]*:[[:space:]]*)"[^"]*"/\1"[REDACTED]"/g' \
              -e 's/(ANON_KEY|PUBLISHABLE_KEY|SERVICE_ROLE_KEY|SECRET_KEY|JWT_SECRET|DB_URL)=([^[:space:]]+)/\1=[REDACTED]/g'
      - name: Configure local Supabase environment
        run: |
          set -euo pipefail
          status="$(npx supabase status -o env)"
          api_url="$(printf '%s\n' "$status" | sed -n 's/^API_URL=//p')"
          publishable_key="$(printf '%s\n' "$status" | sed -n 's/^PUBLISHABLE_KEY=//p')"
          test -n "$api_url"
          test -n "$publishable_key"
          {
            printf 'NEXT_PUBLIC_SUPABASE_URL=%s\n' "$api_url"
            printf 'NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY=%s\n' "$publishable_key"
          } > .env.local
      - run: npm run test:db
      - run: npm run test:db:race
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
