name: CI

on:
  pull_request:
  push:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run format:check
      - run: npm test
      - run: npm run test:unit:tz

  db-and-e2e:
    runs-on: ubuntu-latest
    env:
      SUPABASE_PROJECT_REF: abcdefghijklmnopqrst
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Start local Supabase
        run: |
          set -o pipefail
          npx supabase start \
            -x realtime,storage-api,imgproxy,studio,edge-runtime,logflare,vector,postgres-meta,supavisor \
            2>&1 | sed -E \
              -e 's/("(ANON_KEY|PUBLISHABLE_KEY|SERVICE_ROLE_KEY|SECRET_KEY|JWT_SECRET|DB_URL)"[[:space:]]*:[[:space:]]*)"[^"]*"/\1"[REDACTED]"/g' \
              -e 's/(ANON_KEY|PUBLISHABLE_KEY|SERVICE_ROLE_KEY|SECRET_KEY|JWT_SECRET|DB_URL)=([^[:space:]]+)/\1=[REDACTED]/g'
      - name: Configure local Supabase environment
        run: |
          set -euo pipefail
          status="$(npx supabase status -o env)"
          api_url="$(printf '%s\n' "$status" | sed -n 's/^API_URL=//p')"
          publishable_key="$(printf '%s\n' "$status" | sed -n 's/^PUBLISHABLE_KEY=//p')"
          secret_key="$(printf '%s\n' "$status" | sed -n 's/^SECRET_KEY=//p')"
          mailpit_url="$(printf '%s\n' "$status" | sed -n 's/^MAILPIT_URL=//p')"
          test -n "$api_url"
          test -n "$publishable_key"
          test -n "$secret_key"
          test -n "$mailpit_url"
          {
            printf 'NEXT_PUBLIC_SUPABASE_URL=%s\n' "$api_url"
            printf 'NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY=%s\n' "$publishable_key"
            printf 'SUPABASE_SECRET_KEY=%s\n' "$secret_key"
            printf 'MAILPIT_URL=%s\n' "$mailpit_url"
            printf 'SMTP_HOST=127.0.0.1\n'
            printf 'SMTP_PORT=54325\n'
            printf 'SMTP_USER=\n'
            printf 'SMTP_PASS=\n'
            printf 'SMTP_FROM="GT Carpool <no-reply@gt-carpool.test>"\n'
            printf 'NEXT_PUBLIC_SITE_URL=http://127.0.0.1:3000\n'
            printf 'CRON_SECRET=local-cron-secret\n'
          } > .env.local
      - run: npm run test:db
      - run: npm run test:db:race
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - run: npm run test:lighthouse
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lighthouse-report
          path: lhci_reports/
          retention-days: 7
